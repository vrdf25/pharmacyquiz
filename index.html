<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QuizRx — Secure System</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
  :root {
    --primary: #1a3a5c; --primary-light: #2c527a; --accent: #f0a052;
    --bg: #f4f6f9; --surface: #ffffff; --text: #1a2332;
    --text-muted: #6b7a90; --danger: #c0392b; --success: #1a7a4a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; width: 100vw; overflow: hidden; }

  /* NAVIGATION */
  .screen { display: none; height: 100vh; width: 100%; flex-direction: column; align-items: center; justify-content: center; }
  .screen.active { display: flex; }

  /* LOGIN PAGE */
  #screen-mhs, #screen-login-admin { background: linear-gradient(135deg, #0f2544 0%, #1a3a5c 100%); }
  .admin-trigger { position: fixed; top: 20px; right: 20px; color: #fff; font-size: 11px; cursor: pointer; background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.2); z-index: 100; font-weight: 700; }
  .login-card { background: #fff; border-radius: 24px; padding: 40px; width: 90%; max-width: 400px; box-shadow: 0 25px 50px rgba(0,0,0,0.4); text-align: center; }
  .brand { font-size: 36px; font-weight: 800; color: var(--primary); margin-bottom: 30px; }
  .brand span { color: var(--accent); }

  /* FORM & BUTTONS */
  .form-group { text-align: left; margin-bottom: 15px; }
  label { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 5px; }
  input { width: 100%; padding: 12px; border: 2px solid #edf2f7; border-radius: 10px; font-size: 15px; outline: none; background: #f8fafc; }
  .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; transition: 0.3s; font-size: 14px; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-secondary { background: #f1f5f9; color: var(--text); margin-top: 10px; }

  /* ADMIN DASHBOARD */
  #screen-admin { background: #f4f6f9; justify-content: flex-start; overflow-y: auto; }
  .admin-nav { width: 100%; background: var(--primary); color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
  .admin-tabs { display: flex; background: #fff; width: 100%; border-bottom: 1px solid #ddd; }
  .tab-link { flex: 1; padding: 15px; text-align: center; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--text-muted); border-bottom: 3px solid transparent; }
  .tab-link.active { color: var(--primary); border-bottom-color: var(--primary); }
  .admin-content { padding: 20px; width: 100%; max-width: 600px; display: none; }
  .admin-content.active { display: block; }
  .card { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }

  /* LOG LIST */
  .log-item { font-size: 12px; padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
  .log-name { font-weight: 700; color: var(--danger); }

  /* EXAM SCREEN */
  #screen-ujian { background: #000; position: fixed; inset: 0; z-index: 9999; justify-content: flex-start; }
  .topbar { width: 100%; background: #0f2040; height: 55px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; color: #fff; }
  iframe { width: 100%; height: calc(100vh - 55px); border: none; background: #fff; }
</style>
</head>
<body>

<div class="admin-trigger" onclick="navTo('login-admin')">DOSEN PANEL</div>

<div id="screen-mhs" class="screen active">
  <div class="login-card">
    <div class="brand">Quiz<span>Rx</span></div>
    <div class="form-group"><label>Nama Lengkap</label><input type="text" id="mhs-nama" placeholder="Nama Lengkap"></div>
    <div class="form-group"><label>Kode Ujian</label><input type="text" id="mhs-kode" placeholder="Kode dari Dosen" style="text-transform:uppercase"></div>
    <button class="btn btn-primary" onclick="mulaiUjian()">MASUK UJIAN</button>
  </div>
</div>

<div id="screen-login-admin" class="screen">
  <div class="login-card">
    <h3 style="margin-bottom:20px">Dosen Login</h3>
    <div class="form-group"><label>Password Admin</label><input type="password" id="admin-pass-input"></div>
    <button class="btn btn-primary" onclick="cekAdmin()">MASUK PANEL</button>
    <button class="btn btn-secondary" onclick="navTo('mhs')">KEMBALI</button>
  </div>
</div>

<div id="screen-admin" class="screen">
  <div class="admin-nav">
    <div style="font-weight:800">QuizRx <span>Admin</span></div>
    <button onclick="location.reload()" style="background:none; border:1px solid #fff; color:#fff; padding:5px 10px; border-radius:8px">Keluar</button>
  </div>
  <div class="admin-tabs">
    <div class="tab-link active" onclick="switchTab(event, 'config')">PENGATURAN</div>
    <div class="tab-link" onclick="switchTab(event, 'pelanggaran')">PELANGGARAN</div>
    <div class="tab-link" onclick="switchTab(event, 'password')">AKUN</div>
  </div>

  <div id="tab-config" class="admin-content active">
    <div class="card">
      <h4 style="margin-bottom:15px">Setting Ujian</h4>
      <div class="form-group"><label>Link Google Form</label><input type="text" id="set-link"></div>
      <div class="form-group"><label>Kode Ujian</label><input type="text" id="set-kode"></div>
      <div class="form-group"><label>Durasi (Menit)</label><input type="number" id="set-waktu"></div>
      <button class="btn btn-primary" onclick="saveConfig()">UPDATE SYSTEM</button>
    </div>
  </div>

  <div id="tab-pelanggaran" class="admin-content">
    <div class="card">
      <h4 style="margin-bottom:15px">Log Pelanggaran</h4>
      <div id="log-list"><i>Belum ada data...</i></div>
      <button class="btn btn-secondary" style="margin-top:10px" onclick="clearLog()">Hapus Log</button>
    </div>
  </div>

  <div id="tab-password" class="admin-content">
    <div class="card">
      <h4 style="margin-bottom:15px">Ganti Password Admin</h4>
      <div class="form-group"><label>Password Baru</label><input type="password" id="new-pass"></div>
      <button class="btn btn-danger" onclick="changePass()">GANTI PASSWORD</button>
    </div>
  </div>
</div>

<div id="screen-ujian" class="screen">
  <div class="topbar">
    <div id="timer" style="font-weight:800; color:var(--accent); font-family:monospace">00:00</div>
    <div id="display-nama" style="font-size:11px">MAHASISWA</div>
    <button onclick="konfirmasiSelesai()" style="background:var(--danger); color:#fff; border:none; padding:5px 10px; border-radius:8px; font-weight:700">SELESAI</button>
  </div>
  <div id="exam-frame-container"></div>
</div>

<script>
let db = JSON.parse(localStorage.getItem('quiz_db')) || {
  link: "", kode: "RX-01", waktu: 60, pass: "dosen123", logs: []
};

let strike = 0; let isExam = false; let currentMhs = "";

function navTo(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

function switchTab(e, tabId) {
  document.querySelectorAll('.tab-link').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.admin-content').forEach(c => c.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById('tab-' + tabId).classList.add('active');
  if(tabId === 'pelanggaran') renderLogs();
}

// LOGIKA ADMIN
function cekAdmin() {
  if(document.getElementById('admin-pass-input').value === db.pass) {
    navTo('admin');
    document.getElementById('set-link').value = db.link;
    document.getElementById('set-kode').value = db.kode;
    document.getElementById('set-waktu').value = db.waktu;
  } else { alert("Password Salah!"); }
}

function saveConfig() {
  db.link = document.getElementById('set-link').value;
  db.kode = document.getElementById('set-kode').value.toUpperCase();
  db.waktu = document.getElementById('set-waktu').value;
  saveDB(); alert("Berhasil diupdate!");
}

function changePass() {
  const p = document.getElementById('new-pass').value;
  if(p.length < 4) return alert("Minimal 4 karakter!");
  db.pass = p; saveDB(); alert("Password diganti!");
}

function renderLogs() {
  const container = document.getElementById('log-list');
  container.innerHTML = db.logs.length ? db.logs.map(l => `<div class="log-item"><span>${l.time}</span><span class="log-name">${l.nama}</span><span>${l.type}</span></div>`).reverse().join('') : "<i>Belum ada pelanggaran.</i>";
}

function clearLog() { db.logs = []; saveDB(); renderLogs(); }
function saveDB() { localStorage.setItem('quiz_db', JSON.stringify(db)); }

// LOGIKA MAHASISWA
function mulaiUjian() {
  const nama = document.getElementById('mhs-nama').value;
  const kode = document.getElementById('mhs-kode').value.toUpperCase();
  if(!nama || kode !== db.kode) return alert("Data atau Kode Salah!");
  if(!db.link) return alert("Link soal belum diatur Dosen!");

  currentMhs = nama;
  document.getElementById('display-nama').textContent = nama.toUpperCase();
  document.getElementById('exam-frame-container').innerHTML = `<iframe src="${db.link}"></iframe>`;
  navTo('ujian');
  
  if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  isExam = true; strike = 0;
  startTimer(db.waktu);
  
  window.onblur = () => {
    if(isExam) {
      strike++;
      db.logs.push({ time: new Date().toLocaleTimeString(), nama: currentMhs, type: `Keluar/Blur (${strike})` });
      saveDB();
      if(strike >= 3) { alert("Diskualifikasi! 3x Pelanggaran."); location.reload(); }
      else alert(`PERINGATAN ${strike}/3! Jangan keluar halaman.`);
    }
  };
}

function startTimer(min) {
  let sec = min * 60;
  const timerEl = document.getElementById('timer');
  const clock = setInterval(() => {
    if(!isExam) { clearInterval(clock); return; }
    let m = Math.floor(sec / 60), s = sec % 60;
    timerEl.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    if(sec <= 0) { clearInterval(clock); alert("Waktu Habis!"); location.reload(); }
    sec--;
  }, 1000);
}

function konfirmasiSelesai() {
  if(confirm("Yakin Selesai? Pastikan sudah Submit di Google Form.")) { isExam = false; location.reload(); }
}

document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
