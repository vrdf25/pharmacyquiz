<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QuizRx — Secure Exam System</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

  :root {
    --primary: #1a3a5c;
    --accent: #f0a052;
    --bg: #f4f6f9;
    --surface: #ffffff;
    --text: #1a2332;
    --text-muted: #6b7a90;
    --danger: #c0392b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

  /* NAVIGATION */
  .screen { display: none; height: 100vh; width: 100%; flex-direction: column; }
  .screen.active { display: flex; }

  /* LOGIN SCREEN */
  #screen-login { 
    background: linear-gradient(135deg, #0f2544 0%, #1a3a5c 100%); 
    align-items: center; justify-content: center; padding: 20px; 
  }
  .admin-trigger { 
    position: absolute; top: 20px; right: 20px; color: rgba(255,255,255,0.4); 
    font-size: 11px; cursor: pointer; background: rgba(255,255,255,0.1); 
    padding: 8px 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); 
  }

  .login-card { 
    background: #fff; border-radius: 20px; padding: 30px; width: 100%; max-width: 380px; 
    box-shadow: 0 20px 40px rgba(0,0,0,0.3); text-align: center;
  }
  .brand { font-size: 32px; font-weight: 800; color: var(--primary); margin-bottom: 25px; }
  .brand span { color: var(--accent); }

  /* FORM ELEMENTS */
  .form-group { text-align: left; margin-bottom: 15px; }
  label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 5px; }
  input { 
    width: 100%; padding: 12px; border: 1.5px solid #dde2ea; border-radius: 10px; 
    font-size: 15px; outline: none; background: #f9f9f9;
  }
  .btn { 
    width: 100%; padding: 12px; border-radius: 10px; border: none; 
    font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-secondary { background: #eee; color: var(--text); }

  /* ADMIN DASHBOARD */
  #screen-admin { background: #f4f6f9; overflow-y: auto; display: none; }
  .admin-nav { background: var(--primary); color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
  .admin-content { padding: 20px; max-width: 500px; margin: 0 auto; }
  .card { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }

  /* EXAM SCREEN */
  #screen-ujian { background: #000; position: fixed; inset: 0; z-index: 9999; }
  .topbar { background: #0f2040; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; color: #fff; }
  .iframe-wrap { flex: 1; background: #fff; }
  iframe { width: 100%; height: 100%; border: none; }

  /* OVERLAYS */
  .overlay { 
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); 
    z-index: 10000; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.active { display: flex; }
  .modal { background: #fff; padding: 25px; border-radius: 15px; text-align: center; max-width: 300px; }
</style>
</head>
<body>

<div class="admin-trigger" onclick="navTo('login-admin')">ADMIN MODE</div>

<div id="screen-mhs" class="screen active">
  <div class="login-card">
    <div class="brand">Quiz<span>Rx</span></div>
    <div class="form-group">
      <label>Nama Lengkap</label>
      <input type="text" id="mhs-nama" placeholder="Sesuai Absen">
    </div>
    <div class="form-group">
      <label>Kode Ujian</label>
      <input type="text" id="mhs-kode" placeholder="Masukkan Kode">
    </div>
    <button class="btn btn-primary" onclick="mulaiUjian()">MASUK UJIAN</button>
  </div>
</div>

<div id="screen-login-admin" class="screen">
  <div class="login-card">
    <h3 style="margin-bottom:20px">Dosen Login</h3>
    <div class="form-group">
      <label>Password Admin</label>
      <input type="password" id="admin-pass" placeholder="Password: dosen123">
    </div>
    <button class="btn btn-primary" onclick="cekAdmin()">LOGIN</button>
    <button class="btn btn-secondary" onclick="navTo('mhs')">KEMBALI</button>
  </div>
</div>

<div id="screen-admin" class="screen">
  <div class="admin-nav">
    <div style="font-weight:700">Panel Dosen QuizRx</div>
    <button onclick="location.reload()" style="background:none; border:1px solid #fff; color:#fff; padding:4px 8px; border-radius:5px">Keluar</button>
  </div>
  <div class="admin-content">
    <div class="card">
      <h4 style="margin-bottom:15px">Pengaturan Ujian</h4>
      <div class="form-group">
        <label>Link Google Form</label>
        <input type="text" id="set-link" placeholder="https://docs.google.com/forms/...">
      </div>
      <div class="form-group">
        <label>Kode Ujian Mahasiswa</label>
        <input type="text" id="set-kode" placeholder="Contoh: RX-01">
      </div>
      <div class="form-group">
        <label>Durasi (Menit)</label>
        <input type="number" id="set-waktu" value="60">
      </div>
      <button class="btn btn-primary" onclick="saveConfig()">SIMPAN SETTING</button>
    </div>
    <p style="font-size:12px; color:gray; text-align:center">Semua perubahan akan langsung aktif untuk mahasiswa.</p>
  </div>
</div>

<div id="screen-ujian" class="screen">
  <div class="topbar">
    <div id="timer" style="font-weight:700; color:var(--accent)">00:00</div>
    <div id="display-nama" style="font-size:12px">MAHASISWA</div>
    <button onclick="konfirmasiSelesai()" style="background:var(--danger); color:#fff; border:none; padding:4px 10px; border-radius:5px; font-weight:700">SELESAI</button>
  </div>
  <div class="iframe-wrap" id="exam-container"></div>
</div>

<div id="modal-vio" class="overlay">
  <div class="modal">
    <h2 style="color:var(--danger)">PERINGATAN!</h2>
    <p id="vio-msg" style="margin:15px 0; font-size:14px">Jangan meninggalkan halaman ujian.</p>
    <button class="btn btn-primary" onclick="tutupVio()">SAYA MENGERTI</button>
  </div>
</div>

<script>
// DATA DEFAULT (Tersimpan di Browser)
let db = JSON.parse(localStorage.getItem('quiz_db')) || {
  link: "https://docs.google.com/forms/d/e/1FAIpQLSfsI_R-Vb_h-Z6l_X8uI-J9I5A-X-YV9S_S/viewform?embedded=true",
  kode: "QUIZ-RX",
  waktu: 60
};

let strike = 0;
let isExam = false;

// NAVIGASI ANTAR HALAMAN
function navTo(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

// FUNGSI ADMIN
function cekAdmin() {
  const pass = document.getElementById('admin-pass').value;
  if(pass === "dosen123") {
    navTo('admin');
    document.getElementById('set-link').value = db.link;
    document.getElementById('set-kode').value = db.kode;
    document.getElementById('set-waktu').value = db.waktu;
  } else {
    alert("Password Salah!");
  }
}

function saveConfig() {
  db.link = document.getElementById('set-link').value;
  db.kode = document.getElementById('set-kode').value.toUpperCase();
  db.waktu = document.getElementById('set-waktu').value;
  localStorage.setItem('quiz_db', JSON.stringify(db));
  alert("Data Berhasil Disimpan!");
  navTo('mhs');
}

// FUNGSI MAHASISWA
function mulaiUjian() {
  const nama = document.getElementById('mhs-nama').value;
  const kode = document.getElementById('mhs-kode').value.toUpperCase();

  if(!nama || !kode) return alert("Isi Nama dan Kode!");
  if(kode !== db.kode) return alert("Kode Ujian Salah!");

  document.getElementById('display-nama').textContent = nama.toUpperCase();
  document.getElementById('exam-container').innerHTML = `<iframe src="${db.link}"></iframe>`;
  
  navTo('ujian');
  
  // Fullscreen
  const el = document.documentElement;
  if(el.requestFullscreen) el.requestFullscreen();

  isExam = true;
  startTimer(db.waktu);
  startSecurity();
}

function startTimer(min) {
  let sec = min * 60;
  const timerEl = document.getElementById('timer');
  const clock = setInterval(() => {
    if(!isExam) { clearInterval(clock); return; }
    let m = Math.floor(sec / 60);
    let s = sec % 60;
    timerEl.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    if(sec <= 0) { clearInterval(clock); alert("Waktu Habis!"); location.reload(); }
    sec--;
  }, 1000);
}

function startSecurity() {
  window.onblur = () => {
    if(isExam) {
      strike++;
      if(strike >= 3) { alert("Diskualifikasi! Anda keluar 3x."); location.reload(); }
      else { 
        document.getElementById('vio-msg').innerHTML = `Anda terdeteksi keluar ujian!<br>Peringatan: <b>${strike}/3</b>`;
        document.getElementById('modal-vio').classList.add('active');
      }
    }
  };
}

function tutupVio() {
  document.getElementById('modal-vio').classList.remove('active');
  document.documentElement.requestFullscreen();
}

function konfirmasiSelesai() {
  if(confirm("Pastikan sudah klik SUBMIT di Google Form. Yakin selesai?")) {
    isExam = false;
    location.reload();
  }
}

// Matikan Klik Kanan
document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
